<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guruji — AI Teacher</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">guruji<span>.</span></div>
        <button class="new-chat" onclick="newChat()">+ New</button>
      </div>
      <div class="conversations" id="conversations"></div>
      <div class="sidebar-footer">
        <a href="/admin" class="admin-link">Admin Panel</a>
      </div>
    </aside>

    <main class="chat-area">
      <div class="messages" id="messages">
        <div class="welcome" id="welcome">
          <div class="welcome-icon">g</div>
          <h1>What do you want to learn?</h1>
          <p>Guruji teaches through analogy, questions, and iterative refinement — the Feynman method.</p>
          <div class="suggestions">
            <button onclick="askSuggestion('Quantum computing')">Quantum computing</button>
            <button onclick="askSuggestion('How neural networks learn')">Neural networks</button>
            <button onclick="askSuggestion('Relativity')">Relativity</button>
            <button onclick="askSuggestion('Blockchain')">Blockchain</button>
          </div>
        </div>
      </div>

      <div class="input-area">
        <div class="voice-controls">
          <label class="switch" title="Live voice conversation">
            <input type="checkbox" id="voiceToggle" onchange="toggleVoice()">
            <span class="slider"></span>
            <span class="switch-label">Voice Mode</span>
          </label>
          <select id="voiceLang" onchange="updateVoiceLang()" title="Voice language">
            <option value="en-IN">English (India)</option>
            <option value="en-US">English (US)</option>
            <option value="hi-IN">Hindi</option>
          </select>
          <span class="voice-status" id="voiceStatus"></span>
        </div>
        <div class="input-wrapper">
          <textarea id="input" placeholder="Ask anything..." rows="1" onkeydown="handleKey(event)"></textarea>
          <button class="mic-btn" id="micBtn" onclick="toggleMic()" title="Push to talk">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
          </button>
          <button class="send-btn" id="sendBtn" onclick="send()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/></svg>
          </button>
        </div>
        <p class="disclaimer">Guruji can make mistakes. Verify important information.</p>
      </div>
    </main>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
